services:
  - type: web
    name: saathi-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: saathi-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: saathi-db
    plan: free
