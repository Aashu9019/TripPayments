[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to Render. Works even if VITE_API_URL is not set,
# and keeps requests same-origin (no CORS needed). Must come before the SPA rule.
[[redirects]]
  from = "/api/*"
  to = "https://sajilotrip-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
