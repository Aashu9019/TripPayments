services:
  # API: Express + Postgres (Neon).
  - type: web
    name: sajilotrip-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres connection string (pooled), set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Web app URL(s), comma-separated, set in the Render dashboard.
      - key: CORS_ORIGIN
        sync: false

  # Web app: the PWA as a free static site (no deploy credits, no host badge).
  # Only redeploys when files under web/ change.
  - type: web
    name: sajilotrip
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the build: where the app sends API requests.
      - key: VITE_API_URL
        value: https://sajilotrip-api.onrender.com
    headers:
      # Never cache the app shell or service worker, so updates reach phones.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: every path that isn't a real file serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
