services:
  - type: web
    name: sajilotrip-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres connection string (pooled), set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Netlify site URL(s), comma-separated, set in the Render dashboard.
      - key: CORS_ORIGIN
        sync: false
      # Superadmin login, set in the Render dashboard. Password: 10+ characters.
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
